name: Publish RotorVibe
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, e.g. v0.1.0a2 (never a branch)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify tag and clean source before build
        run: python tools/release_contract.py --tag "$RELEASE_TAG"
      - name: Verify source
        run: |
          python -m pip install -e '.[verification]'
          python -m pip check
          python -m unittest discover -s tests -v
          python tools/run_readme_examples.py
          python tools/audit_release.py
      - name: Build this tag
        run: |
          python -m build --no-isolation
          python -m twine check dist/*
          python tools/audit_release.py --dist dist
          python tools/release_contract.py --dist dist --checksums release-metadata/SHA256SUMS.txt
      - name: Verify installed wheel outside source checkout
        run: |
          python -m venv /tmp/rotorvibe-wheel
          /tmp/rotorvibe-wheel/bin/python -m pip install dist/*.whl
          source_root="$PWD"
          cd /tmp
          /tmp/rotorvibe-wheel/bin/python -c "import rotorvibe; from rotorvibe import DecisionStage, normalize_decision; assert rotorvibe.__version__ == '${RELEASE_TAG#v}'"
          /tmp/rotorvibe-wheel/bin/python "$source_root/tools/run_readme_examples.py" --installed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-metadata
          path: release-metadata/SHA256SUMS.txt
          if-no-files-found: error
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          skip-existing: false
  github-release:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-distributions
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-metadata
          path: release-metadata
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: RotorVibe ${{ env.RELEASE_TAG }}
          body_path: docs/RELEASE_NOTES.md
          prerelease: ${{ contains(env.RELEASE_TAG, 'a') || contains(env.RELEASE_TAG, 'b') || contains(env.RELEASE_TAG, 'rc') }}
          make_latest: false
          files: |
            dist/*
            release-metadata/SHA256SUMS.txt
