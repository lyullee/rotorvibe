name: Publish RotorVibe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Restore reviewed public source from immutable archive
        run: |
          curl --fail --location --retry 3 'https://zenodo.org/records/23937890/files/rotorvibe-0.1.0a1.tar.gz?download=1' -o /tmp/source.tar.gz
          echo '063ceafaed83778709e6c9bd7b879cecf2ab4dce22842170ecab128899bda685  /tmp/source.tar.gz' | sha256sum -c -
          mkdir /tmp/source
          python -c "import tarfile; t=tarfile.open('/tmp/source.tar.gz'); t.extractall('/tmp/source', filter='data')"
          rsync -a --exclude='PKG-INFO' --exclude='*.egg-info' /tmp/source/rotorvibe-0.1.0a1/ ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --cached --quiet || git commit -m 'Restore reviewed RotorVibe source, documentation and reproducibility evidence'
          git push origin HEAD:main
      - name: Validate source and portable calculations
        run: |
          python -m pip install -e '.[verification]'
          python -m unittest discover -s tests
          python tools/audit_release.py
      - name: Fetch exact archived distributions
        run: |
          mkdir -p dist
          cp /tmp/source.tar.gz dist/rotorvibe-0.1.0a1.tar.gz
          curl --fail --location --retry 3 'https://zenodo.org/records/23937890/files/rotorvibe-0.1.0a1-py3-none-any.whl?download=1' -o dist/rotorvibe-0.1.0a1-py3-none-any.whl
          echo '011002b53c2c79635ef89d9895afac08229b0cf8cfedb5da7e9d3618ac44bccd  dist/rotorvibe-0.1.0a1-py3-none-any.whl' | sha256sum -c -
          python -m twine check dist/*
          python tools/audit_release.py --dist dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-distributions
          path: dist/*
  pypi:
    needs: prepare
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          skip-existing: true
